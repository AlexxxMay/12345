name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Unit tests
        run: cargo test --lib
      - name: Type-check Windows/macOS platform code
        run: cargo check --features check-windows,check-macos
      - name: CLI smoke test
        run: |
          cargo build --release
          ./target/release/forgecad snapshot ui.png --script box,ok
          ls -la ui.png

  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
      - name: Version
        id: ver
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cargo build --release
      - name: Smoke test
        shell: bash
        run: |
          ./target/release/forgecad.exe snapshot ui-windows.png --script box,ok,cylinder
          ls -la target/release/forgecad.exe ui-windows.png
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\windows\forgecad.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item target\release\forgecad.exe portable\
          Copy-Item README.md portable\README.txt
          Compress-Archive -Path portable\* -DestinationPath "target\installer\ForgeCAD-${{ steps.ver.outputs.version }}-windows-x64-portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeCAD-windows-x64
          path: |
            target/installer/*.exe
            target/installer/*.zip
            ui-windows.png
          if-no-files-found: error

  macos:
    name: macOS 12+ universal (Intel + Apple Silicon)
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable
      - name: Version
        id: ver
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/forgecad \
            target/aarch64-apple-darwin/release/forgecad \
            target/x86_64-apple-darwin/release/forgecad
          lipo -info target/universal/forgecad
          otool -l target/aarch64-apple-darwin/release/forgecad | grep -A4 LC_BUILD_VERSION | head -8
      - name: Smoke test
        run: ./target/universal/forgecad snapshot ui-macos.png --script box,ok,cylinder && ls -la ui-macos.png
      - name: App bundle
        run: |
          VER="${{ steps.ver.outputs.version }}"
          APP="target/dmg/ForgeCAD.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/universal/forgecad "$APP/Contents/MacOS/forgecad"
          sed "s/@VERSION@/$VER/g" installer/macos/Info.plist > "$APP/Contents/Info.plist"
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          ICONSET=target/ForgeCAD.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon/icon-1024.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s*2))
            sips -z $d $d assets/icon/icon-1024.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/ForgeCAD.icns"
          cp README.md "$APP/Contents/Resources/README.txt"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
      - name: DMG
        run: |
          VER="${{ steps.ver.outputs.version }}"
          ln -s /Applications target/dmg/Applications
          mkdir -p target/out
          hdiutil create -volname "ForgeCAD $VER" -srcfolder target/dmg -ov -format UDZO "target/out/ForgeCAD-$VER-macos-universal.dmg"
          (cd target/dmg && ditto -c -k --keepParent ForgeCAD.app "../out/ForgeCAD-$VER-macos-universal.app.zip")
          ls -la target/out
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeCAD-macos-universal
          path: |
            target/out/*
            ui-macos.png
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R artifacts
          files=$(find artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' \))
          gh release create "${GITHUB_REF_NAME}" $files --repo "$GITHUB_REPOSITORY" --title "ForgeCAD ${GITHUB_REF_NAME}" --notes "Сборка ForgeCAD ${GITHUB_REF_NAME}: установщик для Windows x64 и образ DMG для macOS 12+ (Intel и Apple Silicon)." || \
          gh release upload "${GITHUB_REF_NAME}" $files --repo "$GITHUB_REPOSITORY" --clobber
